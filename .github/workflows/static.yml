name: Deploy Sphinx last release and devel docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHON: '3.14'
  UV_NO_SOURCES: '1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Build Current Rolling Release Docs
        env:
          UV_PROJECT_ENVIRONMENT: .venv-curr-release
        run: |
          RELEASE=$(make -C docs -s --no-print-directory print-CURR_ROLLING_RELEASE_VERSION)
          PROJECT=pythonic-fp-$(make -C docs -s --no-print-directory print-PYPI_NAME)
          uv sync --only-group docs
          uv pip install --python .venv-curr-release "${PROJECT}==${RELEASE}"
          PATH="$PWD/.venv-curr-release/bin:$PATH" make -C docs curr_release

      - name: Build Previous Rolling Release Docs
        env:
          UV_PROJECT_ENVIRONMENT: .venv-prev-release
        run: |
          RELEASE=$(make -C docs -s --no-print-directory print-PREV_ROLLING_RELEASE_VERSION)
          PROJECT=pythonic-fp-$(make -C docs -s --no-print-directory print-PYPI_NAME)
          uv sync --only-group docs
          uv pip install --python .venv-prev-release "${PROJECT}==${RELEASE}"
          PATH="$PWD/.venv-prev-release/bin:$PATH" make -C docs prev_release

      - name: Build Development Docs
        env:
          UV_PROJECT_ENVIRONMENT: .venv-devel
        run: |
          uv run --no-default-groups --group docs -- make -C docs devel

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
