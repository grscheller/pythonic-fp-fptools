[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pythonic-fp-fptools"
version = "6.2.0"
description = "Functional programming tools for Python."
readme = "README.md"
requires-python = ">=3.14"  # floor: PEP 649/749 deferred annotations — class-level self-reference possible NameErrors on <3.14
authors = [
  { name = "Geoffrey R. Scheller", email = "geoffrey@scheller.com" },
]
keywords = [
  "either",
  "fp",
  "functional",
  "functional programming",
  "lazy",
  "maybe",
  "monad",
  "non-strict",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "pythonic-fp-booleans>=6",
  "pythonic-fp-circulararray>=6.4",
  "pythonic-fp-gadgets>=6",
]

[project.urls]
Changelog = "https://github.com/grscheller/pythonic-fp-fptools/blob/main/CHANGELOG.md"
Documentation ="https://grscheller.github.io/pythonic-fp-fptools/release/html/"
Homepage = "https://grscheller.github.io/pythonic-fp/"
Source = "https://github.com/grscheller/pythonic-fp-fptools"

[dependency-groups]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.1",
]
test = [
  "pytest>=8.4.1",
]

[tool.flit.module]
name = "pythonic_fp.fptools"

[tool.flit.sdist]
exclude = [
  "docs/",
  "tests/",
  "**/.mypy_cache/",
  "**/.ruff_cache/",
  "**/.pytest_cache/",
  "**/__pycache__/",
  "**/.dmypy.json",
]

[tool.pytest]
addopts = ["-ra"]
consider_namespace_packages = true
testpaths = ["tests/"]

[tool.mypy]
explicit_package_bases = true
local_partial_types = true
namespace_packages = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["RUF022", "E741"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "E731",
  "C901",
]

[tool.ruff.format]
quote-style = "single"
docstring-code-line-length = 72
